chunk_size: 256
local_cpu: True
max_local_cpu_size: 5
enable_async_loading: True

# P2P peer ports for instance 2. If these ports change, keep README.md and any
# custom startup environment in sync.
enable_p2p: True
p2p_host: "localhost"
p2p_init_ports: 8202
p2p_lookup_ports: 8203
transfer_channel: "nixl"

# Controller ports must match start_controller.sh defaults from env.sh.
enable_controller: True
lmcache_instance_id: "lmcache_instance_2"
controller_pull_url: "localhost:8300"
controller_reply_url: "localhost:8400"
lmcache_worker_ports: 8501

extra_config:
  lookup_backoff_time: 0.001
  p2p_socket_recv_timeout_ms: 30000
  p2p_socket_send_timeout_ms: 10000
